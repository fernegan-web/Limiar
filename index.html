<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Limiar — Underground Apparel</title>
    <meta
      name="description"
      content="Limiar — Streetwear underground, arte e contracultura. Algumas coisas só podem ser compreendidas depois da travessia."
    />
    <meta property="og:title" content="Limiar — Underground Apparel" />
    <meta
      property="og:description"
      content="Streetwear underground, arte e contracultura com estética Organic Dark Tech."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Manrope:wght@300;400;500;600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Manrope:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <link
      rel="preload"
      as="image"
      type="image/webp"
      imagesrcset="/assets/limiar-logo-256.webp 256w, /assets/limiar-logo-512.webp 512w"
      imagesizes="(max-width: 640px) 160px, 220px"
      fetchpriority="high"
    />
    <link id="limiar-favicon" rel="icon" type="image/webp" href="/favicon-black.webp?v=1" />
    <script>
      (function () {
        try {
          var mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
          var faviconLink = document.getElementById('limiar-favicon');
          function updateFavicon(isDark) {
            if (faviconLink) {
              faviconLink.href = isDark ? '/favicon-white.webp?v=1' : '/favicon-black.webp?v=1';
            }
          }
          updateFavicon(mediaQuery.matches);
          if (mediaQuery.addEventListener) {
            mediaQuery.addEventListener('change', function (e) {
              updateFavicon(e.matches);
            });
          } else if (mediaQuery.addListener) {
            mediaQuery.addListener(function (e) {
              updateFavicon(e.matches);
            });
          }
        } catch (e) {}
      })();
    </script>
    <style>
      html.dark, html.dark body { background-color: #080909; color: #e8e7e0; }
      html.light, html.light body { background-color: #e6e4dc; color: #17191a; }
    </style>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('limiar-theme');
          var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
          var theme = stored === 'light' || stored === 'dark' ? stored : (prefersLight ? 'light' : 'dark');
          var root = document.documentElement;
          if (theme === 'dark') {
            root.classList.add('dark');
            root.classList.remove('light');
          } else {
            root.classList.add('light');
            root.classList.remove('dark');
          }
          root.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
